<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Каталог компании Фрейм</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="page">

    <!-- Шапка -->

    <header class="header">

        <div class="logo">

            <img src="images/logo.png" alt="Фрейм">

        </div>

        <div class="header-title">

            <h1>Каталог компании Фрейм</h1>

            <p>Внутренний каталог мебели и изделий</p>

        </div>

        <div class="header-image">

            <img src="images/header-sofa.png" alt="Диван">

        </div>

    </header>

    <!-- Поиск -->

    <section class="search-panel">

        <input
            id="search"
            type="text"
            placeholder="Поиск товара по названию, артикулу или коду..."
            onkeyup="searchProducts()"
        >

    </section>

    <!-- Основная часть -->

    <main class="content">

        <!-- Категории -->

        <aside class="sidebar">

            <h2>Категории</h2>

            <ul id="categoryList">

                <li onclick="filterCategory('all')">
                    Все товары
                </li>

            </ul>

        </aside>

        <!-- Карточки -->

        <section
            class="products"
            id="products"
        >

        </section>

    </main>

</div>

<script src="app.js"></script>

</body>

</html>
